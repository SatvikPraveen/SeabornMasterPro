name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,app]"
      - name: Run tests
        run: pytest --cov --cov-report=xml --cov-report=term -m "not notebooks"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  reproducibility:
    name: Data manifest & examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Datasets regenerate byte-for-byte
        run: |
          smp-datasets --out /tmp/regen
          for f in datasets/*.csv; do cmp "$f" "/tmp/regen/$(basename "$f")"; done
      - name: Manifest verifies
        run: |
          python - <<'EOF'
          from seabornmasterpro.repro import verify_manifest
          results = verify_manifest("datasets/MANIFEST.json")
          bad = [k for k, ok in results.items() if not ok]
          assert not bad, f"manifest mismatch: {bad}"
          print(f"{len(results)} files verified")
          EOF
      - name: Example scripts run
        run: |
          set -e
          for s in basic_workflow production_dashboard custom_styling statistical_viz batch_processing publication_figures research_figure; do
            echo "::group::$s"
            python -W error::FutureWarning examples/$s.py --output /tmp/examples/$s
            echo "::endgroup::"
          done
          python -W error::FutureWarning examples/reusable_template.py --data datasets/sales_data.csv --heatmap --output /tmp/examples/reusable_template
      - name: Benchmark smoke test
        run: smp-benchmark --sizes 100 500 --repeats 2 --out /tmp/bench

  notebooks:
    name: Notebooks execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,notebooks]"
      - name: Execute curriculum notebooks
        run: pytest -m notebooks -q

  build:
    name: Package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
